name: Recover pending Vercel production updates

# Git deployment quota can block newer changes, so compare the entire public
# site release instead of a single old layout marker.
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-production-recovery
  cancel-in-progress: false

jobs:
  check-and-retry:
    name: Check production parity, retry safely when stale
    if: github.repository == 'gustavoeditor/portfolio-gustavo'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          persist-credentials: true

      - name: Check public release against all important site assets
        id: production
        shell: bash
        run: bash scripts/check-production.sh

      - name: Retry a blocked Git-connected production deployment
        if: steps.production.outputs.live == 'false'
        shell: bash
        run: |
          set -euo pipefail
          # Avoid retry storms or consuming all Hobby-plan builds.
          attempts="$(git log --since='14 days ago' --pretty=%s | grep -c '^chore: retry production update$' || true)"
          if (( attempts >= 4 )); then
            echo "::warning::Already retried four times in two weeks. Next scheduled checks will continue."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          git commit --allow-empty -m 'chore: retry production update'
          if ! git push origin HEAD:main; then
            echo "::warning::Remote main moved during retry. A later check will reconcile."
          fi
