name: Portfolio integrity checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Check media, scripts and conversion links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build upload client
        run: npm run build:upload-client
      - name: Verify portfolio
        run: npm test

  mobile-layout:
    name: Check responsive layout in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install lightweight browser test harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Validate widths, centered sections and quote layout
        run: node scripts/check-mobile-layout.cjs
      - name: Validate Gustavo Trio storefront on phone, tablet and desktop
        run: node scripts/check-storefront-layout.cjs
      - name: Save storefront visual reference
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gustavo-trio-storefront-previews
          path: out/loja-*.png
          retention-days: 7
          if-no-files-found: warn

  thumbnails:
    name: Decode and verify all 17 project covers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Check local and production thumbnails in Chrome
        env:
          CHECK_PRODUCTION_THUMBS: '1'
        run: node scripts/check-thumbnails.cjs
      - name: Save full thumbnail reference sheet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thumbnail-contact-sheets
          path: out/thumbs-contact-sheet-*.png
          retention-days: 7
          if-no-files-found: warn
