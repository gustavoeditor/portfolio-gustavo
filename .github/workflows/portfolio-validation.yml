name: Portfolio integrity checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Check media, scripts and conversion links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify portfolio
        run: npm test

  mobile-layout:
    name: Check responsive layout in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser test harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Validate widths, centered sections and quote layout
        run: node scripts/check-mobile-layout.cjs
