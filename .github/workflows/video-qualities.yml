name: Gerar qualidades otimizadas dos vídeos

# Gera a escada 144p → 2160p (até a resolução de cada vídeo) para:
#  - os vídeos do repositório (videos/), quando entram ou mudam;
#  - os vídeos enviados pelo painel (Vercel Blob), verificados a cada hora.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-qualities.yml'
      - 'videos/**'
      - 'scripts/generate-video-ladder.cjs'
      - 'scripts/build-video-qualities.cjs'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-video-qualities
  cancel-in-progress: false

jobs:
  encode:
    name: Gerar escada de qualidades
    if: github.repository == 'gustavoeditor/portfolio-gustavo'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Gerar qualidades que faltam (repositório + uploads do painel)
        run: node scripts/generate-video-ladder.cjs
      - name: Atualizar o manifesto de qualidades de cada vídeo
        run: node scripts/build-video-qualities.cjs
      - name: Conferir antes de publicar
        run: node scripts/verify-portfolio.cjs
      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'videos-*/' video-renditions/managed.json video-qualities.js
          if git diff --cached --quiet; then
            echo "Nenhuma qualidade nova."
            exit 0
          fi
          git commit -m "Generate video quality ladder (144p-2160p)"
          git pull --rebase origin main
          git push origin HEAD:main
