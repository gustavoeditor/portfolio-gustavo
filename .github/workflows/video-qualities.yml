name: Gerar qualidades otimizadas dos vídeos

# Gera a escada 144p → 2160p (até a resolução de cada vídeo, 60 fps a partir de 720p) para:
#  - vídeos enviados pelo painel: disparado na hora pela publicação (repository_dispatch
#    "new-upload", precisa de GITHUB_RENDITIONS_TOKEN na Vercel) e, de reserva, a cada 10 min;
#  - vídeos do repositório (videos/), quando entram ou mudam.
# Sem nada novo, termina em segundos sem instalar o FFmpeg.
on:
  repository_dispatch:
    types: [new-upload]
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-qualities.yml'
      - 'videos/**'
      - 'scripts/generate-video-ladder.cjs'
      - 'scripts/build-video-qualities.cjs'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-video-qualities
  cancel-in-progress: false

jobs:
  encode:
    name: Gerar escada de qualidades
    if: github.repository == 'gustavoeditor/portfolio-gustavo'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tem upload novo?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pending=all" >> "$GITHUB_OUTPUT"
          else
            node scripts/generate-video-ladder.cjs --pending
          fi
      - name: Instalar FFmpeg (build estático, sem apt)
        if: steps.check.outputs.pending != '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -version | head -n 1
      - name: Gerar qualidades que faltam
        if: steps.check.outputs.pending != '0'
        run: |
          if [ "${{ steps.check.outputs.pending }}" = "all" ]; then
            node scripts/generate-video-ladder.cjs
          else
            node scripts/generate-video-ladder.cjs --managed
          fi
      - name: Atualizar o manifesto de qualidades de cada vídeo
        if: steps.check.outputs.pending != '0'
        run: node scripts/build-video-qualities.cjs
      - name: Conferir antes de publicar
        if: steps.check.outputs.pending != '0'
        run: |
          npm ci --no-audit --no-fund
          node scripts/verify-portfolio.cjs
      - name: Publicar
        if: steps.check.outputs.pending != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Unquoted so bash expands it to the real videos-144/ … videos-2160/ folders.
          git add -A -- videos-*/ video-renditions/managed.json video-qualities.js
          if git diff --cached --quiet; then
            echo "Nenhuma qualidade nova."
            exit 0
          fi
          git commit -m "Generate video quality ladder (144p-2160p)"
          git pull --rebase origin main
          git push origin HEAD:main
