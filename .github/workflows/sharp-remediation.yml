name: Sharp Security Remediation
on:
  push:
    branches:
      - 'security/sharp-upgrade-*'
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade sharp and check lockfile
        run: |
          npm ci
          npm install --save-exact sharp@0.35.5
          npm ls sharp
      - name: Run portfolio and upload security tests
        run: npm test
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Commit patched manifest to remediation branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: update sharp to 0.35.5 and rebuild npm lock'
            git push origin HEAD:refs/heads/security/sharp-upgrade-20261017
          fi
