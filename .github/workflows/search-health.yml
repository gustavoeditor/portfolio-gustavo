name: Monitoramento de indexacao e acesso publico

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawler-access:
    name: Site acessivel a buscadores
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar pagina principal, robots e sitemap
        run: python scripts/check-search-health.py
