<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0b0b0d">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"><title>Acesso privado | Gustavo</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#141318;--line:#302a3b;--text:#f4f3f0;--muted:#aaa4b5;--accent:#b69aff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% -15%,rgba(111,63,185,.22),transparent 48%),var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(100%,420px);padding:clamp(24px,6vw,38px);border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,rgba(29,25,37,.95),rgba(16,16,20,.98));box-shadow:0 24px 80px #0005}
.brand{font-size:13px;font-weight:800;letter-spacing:.02em}.brand span{color:var(--accent)}.eyebrow{margin-top:36px;color:var(--accent);font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:750}
h1{margin:10px 0;font-size:clamp(30px,8vw,38px);line-height:1.05;letter-spacing:-.06em}.desc{margin:0 0 26px;color:var(--muted);font-size:13px}
label{display:block;margin-bottom:8px;font-size:12px;font-weight:700;color:#ded8e8}input{width:100%;border:1px solid #393343;border-radius:7px;padding:14px;background:#0c0b10;color:var(--text);font:inherit;font-size:14px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #b69aff1a}
button{width:100%;margin-top:15px;padding:13px;border:1px solid var(--accent);border-radius:7px;background:linear-gradient(135deg,#c8b4ff,#a78bfa);color:#160e23;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:wait}
.status{min-height:22px;margin:14px 0 0;color:#ffb8c0;font-size:12px}.back{display:inline-block;margin-top:20px;color:#d4c7f5;font-size:12px;text-decoration:none}.back:hover{text-decoration:underline}
</style><link rel="stylesheet" href="/upload-ui.css?v=1">
</head><body><main class="card">
<a class="brand" href="/" style="color:inherit;text-decoration:none">GUSTAVO<span>.</span> / PAINEL PRIVADO</a>
<div class="eyebrow">Acesso restrito</div><h1>Seu espaço de trabalho.</h1>
<p class="desc">Entre com a senha administrativa para gerenciar os vídeos do portfólio. Esta área não é pública.</p>
<form id="login-form"><label for="password">Senha administrativa</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><div id="second-factor" hidden style="margin-top:16px"><label for="code">Código do autenticador</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000"></div><button id="submit" type="submit">Entrar no painel</button><p class="status" id="status" role="status" aria-live="polite"></p></form>
<a class="back" href="/">← Voltar ao portfólio público</a></main>
<script>
(() => {
const form=document.getElementById('login-form'),input=document.getElementById('password'),button=document.getElementById('submit'),status=document.getElementById('status');
async function check(){try{const r=await fetch('/api/admin-auth',{cache:'no-store',credentials:'same-origin'});const data=await r.json().catch(()=>({}));document.getElementById('second-factor').hidden=!data.secondFactorRequired;document.getElementById('code').required=Boolean(data.secondFactorRequired);if(r.ok)location.replace('/gerenciar-projetos.html');else if(r.status===503)status.textContent='Configuração pendente: adicione ADMIN_PASSWORD e ADMIN_SESSION_SECRET nas variáveis de ambiente da Vercel.';}catch(_){status.textContent='Não foi possível verificar o acesso agora.';}}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Verificando…';status.textContent='';try{const r=await fetch('/api/admin-auth',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value,code:document.getElementById('code').value})});const data=await r.json().catch(()=>({}));if(r.ok){location.replace('/gerenciar-projetos.html');return;}status.textContent=data.error||'Não foi possível entrar.';input.select();}catch(_){status.textContent='Falha de conexão. Tente novamente.';}finally{button.disabled=false;button.textContent='Entrar no painel';}});
check();
})();
</script><script src="/drop-guard.js?v=1" defer></script></body></html>
